# pf anchor: hard-block egress from this Mac to the recorded prod server.
# Loaded as named anchor "wine-replay" — see install instructions in the
# Makefile (`make isolate-help`).
#
# Recording auction-house-v1 server_endpoint events all point to:
#   70.35.198.73 : { 1818, 1819, 18123, 18124 }
#
# This rule blocks outbound TCP/UDP to that IP from anywhere on this Mac
# (any user, any process — including wine'd XenClient.exe and v2_server.py).
# Replay traffic loops on 127.0.0.3 and is unaffected.

block drop out quick proto { tcp udp } from any to 70.35.198.73
